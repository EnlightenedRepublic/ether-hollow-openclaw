name: release

# Publishes ether-hollow-openclaw to npm when a version tag is pushed (v0.1.0 → 0.1.0).
# Auth: an npm automation token in the repository secret NPM_TOKEN, or npm
# trusted publishing (OIDC) configured for the package on npmjs.com, in which
# case the secret can be left unset. `--provenance` attaches the build attestation.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          v=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$tag" != "$v" ]; then echo "tag v$tag != package.json $v"; exit 1; fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
